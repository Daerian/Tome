repos:
  # ── Frontend: Prettier (local, uses project's own prettier install) ──
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: node
        entry: frontend/node_modules/.bin/prettier
        args: [--write]
        types_or: [javascript, jsx, css, json]
        files: ^frontend/src/
        additional_dependencies: []

  # ── Backend: Ruff ───────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
